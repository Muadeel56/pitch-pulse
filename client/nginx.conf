server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — every unknown path serves index.html so react-router can
  # handle deep links (/matches/2) on a hard refresh.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # REST API under /api/* — the trailing slash on proxy_pass strips the /api
  # prefix, so /api/matches/live → http://app:3000/matches/live. Keeps the API
  # namespace clear of the client routes (/matches, /follows, /notifications).
  location /api/ {
    proxy_pass http://app:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Socket.io shares the backend origin and doesn't collide with any route.
  location /socket.io/ {
    proxy_pass http://app:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1d;
  }
}
